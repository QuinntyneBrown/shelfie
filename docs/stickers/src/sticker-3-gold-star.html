<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shelfie sticker — gold star badge</title>
    <link rel="stylesheet" href="stickers.css" />
  </head>
  <body>
    <div class="stage">
      <!--
        Sticker 3 — the "Star" feedback sticker (FEEDBACK_STICKERS in
        sticker-picker.ts) drawn as the achievement badge object
        (docs/design-system/components/achievement-badge.html, R6): a round
        illustration in a coloured ring with a surface gap, a green check disc
        in the bottom-right corner once earned, and the name underneath.
        "Chapter done!" is the celebration copy ("Chapter 12 done!") as a
        two-tone headline (R8): "Chapter" in ink, "done!" in the accent.
        Confetti pieces from the celebration (R5) straddle the ring.
        Disc: #e3d9fb cover-lilac (the app's --color-accent-subtle is too
        close to the white rim at print), r 216 about (450, 330). Rings: a
        16px white gap, then 18px of #7c3aed violet-600 (--color-accent).
        Star: five points, outer radius 165, inner 82, centred (450, 335),
        #f7c15c amber-300 edged #b26f00 amber-500. Check: #1b6b3c green-700
        (--color-success-solid) with a 14px white gap, at 45° on the ring.
        Confetti: 32x48 pieces with 8px corners and 40px dots, like
        .confetti (8x12, --radius-xs, every other piece round), in amber-300,
        violet-300 and green-300 so they read on the ring and on the rim.
        "done!" is #7c3aed on white: 5.7:1, WCAG AA.
        Drawn 1:1 on the canvas, so --cut-extra keeps its 130px default.
      -->
      <svg class="sticker" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
        <title>A gold star badge with a green check, reading Chapter done!</title>

        <!-- Centre the cut on the canvas: drawn as-is, the die cut's margins
             were T15 B40. A pure translate, so the rim stays 65px. -->
        <g transform="translate(0 12)">
          <defs>
            <!-- Arc for the edge URL, over the top of the white rim. The ring's
                 outer edge is r 250 about (450, 330) and the rim runs to r 315;
                 a baseline at r 272 centres the caps (which point outward) in
                 it. The name sits below the badge, so the top is the clear run. -->
            <path id="urlArc" fill="none" d="M 178 330 A 272 272 0 0 1 722 330" />
          </defs>

          <!-- ── Die-cut silhouette ──────────────────────────────────────────
               White fill + fat white stroke with paint-order:stroke, so the
               stroke lies wholly outside each shape. The confetti and the
               check straddle the ring and the name overlaps it, so the union
               is one continuous cut line. -->
          <g>
            <rect class="keyline cut-flat" x="188" y="216" width="32" height="48" rx="8" transform="rotate(20 204 240)" />
            <circle class="keyline cut-flat" cx="696" cy="240" r="20" />
            <circle class="keyline cut-flat" cx="204" cy="420" r="20" />
            <rect class="keyline cut-flat" x="680" y="396" width="32" height="48" rx="8" transform="rotate(-25 696 420)" />
            <circle class="keyline cut-flat" cx="450" cy="330" r="250" />
            <circle class="keyline cut-disc" cx="627" cy="507" r="48" />
            <text class="keyline cut-flat" x="450" y="690" text-anchor="middle" font-family="'Nunito'" font-weight="900" font-size="104" letter-spacing="-1">Chapter</text>
            <text class="keyline cut-flat" x="450" y="795" text-anchor="middle" font-family="'Nunito'" font-weight="900" font-size="104" letter-spacing="-1">done!</text>
          </g>

          <!-- ── The badge: accent ring, surface gap, tinted disc ──────────── -->
          <circle cx="450" cy="330" r="250" fill="#7c3aed" />
          <circle cx="450" cy="330" r="232" fill="#ffffff" />
          <circle cx="450" cy="330" r="216" fill="#e3d9fb" />

          <!-- ── Confetti, over the ring's edge so it stays attached ───────── -->
          <rect x="188" y="216" width="32" height="48" rx="8" fill="#f7c15c" transform="rotate(20 204 240)" />
          <circle cx="696" cy="240" r="20" fill="#c4b5fd" />
          <circle cx="204" cy="420" r="20" fill="#7ed69a" />
          <rect x="680" y="396" width="32" height="48" rx="8" fill="#f7c15c" transform="rotate(-25 696 420)" />

          <!-- ── The gold star ─────────────────────────────────────────────── -->
          <path d="M450.0 170.0 L498.2 268.7 L606.9 284.0 L528.0 360.3 L547.0 468.5 L450.0 417.0 L353.0 468.5 L372.0 360.3 L293.1 284.0 L401.8 268.7 Z" fill="#f7c15c" stroke="#b26f00" stroke-width="16" stroke-linejoin="round" />
          <!-- Shine: a small sparkle on the upper-left arm -->
          <path
            d="M400 275 Q404 293 422 297 Q404 301 400 319 Q396 301 378 297 Q396 293 400 275 Z"
            fill="#ffffff"
          />

          <!-- ── Earned: the green check disc on the ring ──────────────────── -->
          <circle cx="627" cy="507" r="48" fill="#1b6b3c" stroke="#ffffff" stroke-width="14" />
          <path d="M604 507 L619 523 L650 489" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

          <!-- ── Name, two-tone ────────────────────────────────────────────── -->
          <text x="450" y="690" text-anchor="middle" font-family="'Nunito'" font-weight="900" font-size="104" letter-spacing="-1" fill="#1a1e26">Chapter</text>
          <text x="450" y="795" text-anchor="middle" font-family="'Nunito'" font-weight="900" font-size="104" letter-spacing="-1" fill="#7c3aed">done!</text>

          <!-- ── Edge URL ────────────────────────────────────────────────── -->
          <text
            text-anchor="middle"
            font-family="'Nunito'"
            font-weight="800"
            font-size="28"
            letter-spacing="7"
            fill="#1a1e26"
          >
            <textPath href="#urlArc" startOffset="50%">SHELFIE.KIDS</textPath>
          </text>
        </g>
      </svg>
    </div>
  </body>
</html>
