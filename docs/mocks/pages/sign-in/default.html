<a class="skip-link" href="#main">Skip to content</a>
<canvas class="aurora" aria-hidden="true"></canvas>
<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="logo" aria-hidden="true"><span class="logo-mark sticker--bob"><img src="../../assets/logo.png" alt="" width="64" height="64"></span></div>
<div class="card stack">
  <h1 style="text-align: center;">Welcome back</h1>
  <form class="stack stagger" action="../../pages/shelf/default.html" method="get" novalidate>
    <div style="--i: 0;" class="field"><label class="field__label" for="username">Username</label><input class="input" id="username" name="username" type="text" autocomplete="username" required autofocus value="" autocapitalize="none" spellcheck="false"></div>
    <div style="--i: 1;" class="field"><label class="field__label" for="password">Password</label><div class="input-group"><input class="input" id="password" name="password" type="password" autocomplete="current-password" required value=""><button class="btn btn--ghost btn--icon input-group__btn" type="button" aria-label="Show password" aria-pressed="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <label style="--i: 2;" class="switch"><input type="checkbox" name="remember" value="1" checked><span class="switch__text">Keep me signed in</span></label>
    <button style="--i: 3;" class="btn btn--primary btn--lg btn--block" type="submit">Sign in</button>
    <p style="--i: 4; text-align: center;"><a href="../../pages/forgot-password/default.html">Forgot your password?</a></p>
  </form>
</div>
<p class="text-caption" style="text-align: center;">New here? <a href="../../pages/sign-up/default.html">Create a parent account</a></p>
  </div>
</main>
