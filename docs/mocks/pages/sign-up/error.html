<body>
<a class="skip-link" href="#main">Skip to content</a>
<canvas class="aurora" aria-hidden="true"></canvas>
<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="logo" aria-hidden="true"><span class="logo-mark sticker--bob"><img src="../../assets/logo.png" alt="" width="64" height="64"></span></div>
<div class="card stack">
  <h1 style="text-align: center;">Start your shelf</h1>
  <p class="text-muted" style="text-align: center; margin-inline: auto;">Create a parent account.</p>
  <form class="stack stagger" action="../onboarding/welcome.html" method="get" novalidate>
    <div style="--i: 0;" class="alert alert--danger" role="alert"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div class="alert__body"><div class="alert__title">Can’t reach Shelfie</div><div>Check your connection.</div><div class="alert__actions"><button class="btn btn--sm" type="button">Try again</button></div></div></div>
    <div style="--i: 1;" class="field"><label class="field__label" for="name">Your name</label><input class="input" id="name" name="name" type="text" autocomplete="name" required autofocus value="Dad"></div>
    <div style="--i: 2;" class="field"><label class="field__label" for="email">E-mail address</label><input class="input" id="email" name="email" type="email" autocomplete="email" required value="marcus@example.com"></div>
    <div style="--i: 3;" class="field"><label class="field__label" for="username">Username</label><div class="field__help" id="username-help">3–20 letters, numbers, . or _</div><input class="input" id="username" name="username" type="text" autocomplete="username" required aria-describedby="username-help" value="marcus" autocapitalize="none" spellcheck="false" minlength="3" maxlength="20"></div>
    <div class="grid grid--auto" style="--i: 4; gap: var(--space-4);"><div class="field"><label class="field__label" for="password">Password</label><div class="field__help" id="password-help">At least 8 characters</div><div class="input-group"><input class="input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-help" value="••••••••••••"><button class="btn btn--ghost btn--icon input-group__btn" type="button" aria-label="Show password" aria-pressed="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="field"><label class="field__label" for="confirm">Type it again</label><div class="input-group"><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required value="••••••••••••"><button class="btn btn--ghost btn--icon input-group__btn" type="button" aria-label="Show type it again" aria-pressed="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div></div>
    <button style="--i: 5;" class="btn btn--primary btn--lg btn--block" type="submit">Create my account</button>
  </form>
</div>
<p class="text-caption" style="text-align: center;">Already have an account? <a href="../../pages/sign-in/default.html">Sign in</a></p>
  </div>
</main>
<p class="mock-note" style="top: 4.5rem; right: 1rem;">Try again resubmits.</p>
