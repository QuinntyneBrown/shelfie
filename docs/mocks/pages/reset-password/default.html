  <div class="auth-card stack">
    <div class="logo" aria-hidden="true"><span class="logo-mark"><img src="../../assets/logo.png" alt="" width="64" height="64"></span></div>
<div class="card stack">
  <h1>Choose a new password</h1>
  <p class="text-muted">For <strong>marcus@example.com</strong>.</p>
  
  <form class="stack" action="success.html" method="get" novalidate>
    <div class="field"><label class="field__label" for="new-password">New password</label><div class="field__help" id="new-password-help">At least 8 characters. A short sentence works well.</div><input class="input" id="new-password" type="password" autocomplete="new-password" required minlength="8" value="" autofocus aria-describedby="new-password-help"></div>
    <div class="field"><label class="field__label" for="confirm-password">Type it again</label><input class="input" id="confirm-password" type="password" autocomplete="new-password" required value=""></div>
    <button class="btn btn--primary btn--lg btn--block" type="submit">Save new password</button>
  </form>
</div>
