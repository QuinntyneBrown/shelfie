<div class="container">
  <sh-error-state
    sticker="🔍"
    title="We can’t find that page"
    text="The link might be old, or the book might have been removed."
  >
    @switch (role) {
      @case ('reader') {
        <a class="btn btn--primary" routerLink="/shelf">Back to my shelf</a>
      }
      @case ('grown_up') {
        <a class="btn btn--primary" routerLink="/review">Go to Review</a>
      }
      @default {
        <a class="btn btn--primary" routerLink="/sign-in">Go to sign in</a>
      }
    }
  </sh-error-state>
</div>
