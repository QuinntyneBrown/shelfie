<sh-dialog [heading]="editing() ? 'Edit the healing activity' : 'Set a healing activity'" [open]="open()" (closed)="busy() || closed.emit()">
  <form id="healing-activity-form" class="stack" (submit)="$event.preventDefault(); save()" novalidate>
    @if (failed()) {
      <sh-banner
        severity="danger"
        [title]="(name().trim() || 'The activity') + ' wasn’t saved'"
        message="Nothing changed."
      >
        <div class="alert__actions">
          <button class="btn btn--sm" type="button" (click)="save()">Try again</button>
        </div>
      </sh-banner>
    }
    <sh-text-field
      label="The activity"
      [help]="'Once a week, this heals a day ' + readerName() + ' missed, so her streak carries on. Up to 100 characters.'"
      [maxlength]="100"
      [autofocus]="true"
      [error]="nameError()"
      [(value)]="name"
    />
  </form>
  <div dialog-actions class="cluster">
    <button class="btn" type="button" [disabled]="busy()" (click)="closed.emit()">Cancel</button>
    <button
      class="btn btn--primary"
      type="submit"
      form="healing-activity-form"
      [disabled]="busy()"
      [attr.aria-busy]="busy() ? true : null"
    >
      {{ editing() ? 'Save changes' : 'Set activity' }}
    </button>
  </div>
</sh-dialog>
