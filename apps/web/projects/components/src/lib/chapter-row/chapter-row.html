<ng-template #content>
  <span class="chapter__num" aria-hidden="true">{{ state() === 'logged' ? '✓' : number() }}</span>
  <span class="chapter__body">
    <span class="chapter__title">Chapter {{ number() }}</span>
    @if (meta(); as meta) {
      <span class="chapter__meta">{{ meta }}</span>
    }
  </span>
  @if (status(); as status) {
    <span class="chapter__status">{{ status }}</span>
  }
</ng-template>
@if (link(); as link) {
  <a
    class="chapter"
    [class.chapter--done]="state() === 'logged'"
    [class.chapter--next]="state() === 'next'"
    [routerLink]="link"
  >
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else {
  <div
    class="chapter"
    [class.chapter--done]="state() === 'logged'"
    [class.chapter--future]="state() === 'future'"
  >
    <ng-container *ngTemplateOutlet="content" />
  </div>
}
