<article class="card book-card">
  <sh-cover [color]="coverColor()" [sticker]="sticker()" [image]="coverImage()" />
  <div class="book-card__body">
    <h3 class="book-card__title">
      <a [routerLink]="link()">{{ title() }}</a>
    </h3>
    @if (author()) {
      <span class="book-card__author">{{ author() }}</span>
    }
    @if (logged() > 0) {
      <sh-progress
        [value]="logged()"
        [max]="chapters()"
        [label]="logged() + ' of ' + chapters() + ' chapters read'"
      />
    }
    <div class="book-card__actions"><ng-content /></div>
  </div>
</article>
