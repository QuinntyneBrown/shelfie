<div class="photo-picker">
  <sh-avatar
    size="xl"
    [name]="name()"
    [color]="color()"
    [photo]="photo()"
    [busy]="busy()"
    [label]="photo() ? 'Your photo' : 'No photo yet'"
  />
  <div class="photo-picker__body">
    <div class="photo-picker__actions">
      <label class="btn btn--primary" [attr.aria-busy]="busy() || null">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 8h3l2-3h6l2 3h3v11H4z" />
          <circle cx="12" cy="13" r="3.5" />
        </svg>
        {{ photo() ? 'Choose another' : 'Choose a photo' }}
        <input
          #file
          class="visually-hidden"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          [disabled]="busy()"
          [attr.aria-invalid]="shownError() ? true : null"
          [attr.aria-describedby]="shownError() ? helpId + ' ' + errorId : helpId"
          (change)="choose($event)"
        />
      </label>
      @if (photo()) {
        <button class="btn btn--ghost" type="button" [disabled]="busy()" (click)="file.focus(); removed.emit()">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
          </svg>
          Remove photo
        </button>
      }
    </div>
    <p class="field__help" role="status" [id]="helpId">
      {{ busy() ? 'Uploading your photo…' : 'A JPEG, PNG or WebP photo, up to 5 MB.' }}
    </p>
    @if (shownError(); as message) {
      <p class="field__error" role="alert" [id]="errorId">{{ message }}</p>
    }
  </div>
</div>
