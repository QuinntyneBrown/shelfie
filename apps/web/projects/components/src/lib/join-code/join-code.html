<div class="join-code">
  <span class="join-code__value" aria-hidden="true">{{ shown() }}</span>
  <span class="visually-hidden">{{ spelt() }}</span>
  <button class="btn btn--sm" type="button" (click)="copy()">
    @if (copied()) {
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6" /></svg>
      Copied!
    } @else {
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 9h11v11H9zM5 15H4V4h11v1" /></svg>
      Copy code
    }
  </button>
  <span class="visually-hidden" role="status">{{ copied() ? 'Copied to the clipboard' : '' }}</span>
</div>
