<div class="field">
  <label class="field__label" [for]="inputId()">{{ label() }}</label>
  @if (help(); as help) {
    <div class="field__help" [id]="inputId() + '-help'">{{ help }}</div>
  }
  <div [class.input-group]="type() === 'password'">
    <input
      class="input"
      [id]="inputId()"
      [type]="inputType()"
      [attr.autocomplete]="autocomplete()"
      [attr.inputmode]="inputmode()"
      [attr.maxlength]="maxlength()"
      [attr.autofocus]="autofocus() ? '' : null"
      [readonly]="readonly()"
      [value]="value()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="describedBy()"
      (input)="edit($event)"
    />
    @if (type() === 'password') {
      <button
        class="btn btn--ghost btn--icon input-group__btn"
        type="button"
        [attr.aria-label]="showLabel()"
        [attr.aria-pressed]="revealed()"
        (click)="revealed.set(!revealed())"
      >
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    }
  </div>
  @if (error(); as message) {
    <div class="field__error" [id]="inputId() + '-error'">{{ message }}</div>
  }
</div>
