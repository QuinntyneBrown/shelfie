<div class="field">
  <label class="field__label" [for]="inputId()"
    ><span class="qa__num">{{ number() }}.</span> {{ label() }}</label
  >
  <textarea
    class="textarea"
    [id]="inputId()"
    rows="3"
    [attr.maxlength]="maxlength()"
    [value]="value()"
    [attr.aria-invalid]="error() ? true : null"
    [attr.aria-describedby]="describedBy()"
    (input)="edit($event)"
  ></textarea>
  @if (supported) {
    <div class="cluster">
      <button
        class="btn btn--ghost"
        type="button"
        [attr.aria-pressed]="listening()"
        [attr.aria-label]="'Speak your answer to question ' + number()"
        (click)="toggleDictation()"
      >
        @if (listening()) {
          <span class="mic-dot" aria-hidden="true"></span>
        } @else {
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3" />
          </svg>
        }
        Speak your answer
      </button>
      @if (listening()) {
        <span class="field__help">Listening… tap to stop</span>
      }
    </div>
    <p class="visually-hidden" role="status">{{ announcement() }}</p>
  }
  @if (error(); as message) {
    <div class="field__error" [id]="inputId() + '-error'">{{ message }}</div>
  }
  @if (micError(); as message) {
    <div class="field__error" [id]="inputId() + '-mic-error'">{{ message }}</div>
  }
  @if (showCounter()) {
    <div class="field__hint" aria-live="polite">
      {{ charactersLeft() }} {{ charactersLeft() === 1 ? 'character' : 'characters' }} left
    </div>
  }
</div>
