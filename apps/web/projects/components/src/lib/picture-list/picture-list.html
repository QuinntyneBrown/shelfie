<div class="field picture-list" role="group" [attr.aria-labelledby]="labelId">
  <span class="field__label" [id]="labelId">{{ label() }} <span class="optional">(optional)</span></span>
  @if (pictures().length) {
    <ul class="picture-list__grid" aria-label="Pictures">
      @for (picture of pictures(); track $index; let i = $index) {
        <li class="picture-list__item" [class.picture-list__item--featured]="picture.featured">
          <div class="picture-list__thumb">
            <img [src]="picture.url" [alt]="'Picture ' + (i + 1) + ' of ' + pictures().length" />
            @if (picture.featured) {
              <span class="badge badge--success">Featured</span>
            }
          </div>
          <div class="picture-list__actions">
            @if (picture.featured) {
              <span class="picture-list__note">Shows on her shelf</span>
            }
          </div>
        </li>
      }
    </ul>
  }
  <div class="picture-list__add">
    <label class="btn btn--sm">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M4 8h3l2-3h6l2 3h3v11H4z" />
        <circle cx="12" cy="13" r="3.5" />
      </svg>
      Add a picture
      <input
        class="visually-hidden"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        [attr.aria-describedby]="helpId"
        (change)="choose($event)"
      />
    </label>
  </div>
  <p class="field__help" role="status" [id]="helpId">{{ help() }}</p>
</div>
