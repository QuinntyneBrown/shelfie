<dialog #dialog class="dialog__panel" [attr.aria-labelledby]="headingId" (cancel)="cancel($event)">
  <div class="dialog__header">
    <h2 class="dialog__title" [id]="headingId">{{ heading() }}</h2>
  </div>
  <div class="dialog__body"><ng-content /></div>
  <div class="dialog__footer"><ng-content select="[dialog-actions]" /></div>
</dialog>
