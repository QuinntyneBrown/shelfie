<div class="pin-dots" role="status" [attr.aria-label]="digits().length + ' of 4 digits entered'">
  @for (slot of slots; track slot) {
    <span [attr.data-filled]="slot < digits().length ? '' : null"></span>
  }
</div>
<div class="pinpad" role="group" aria-label="PIN keypad">
  @for (key of keys; track key) {
    <button class="btn" type="button" (click)="add(key)">{{ key }}</button>
  }
  <button class="btn btn--ghost" type="button" (click)="switchReader.emit()">Not {{ name() }}?</button>
  <button class="btn" type="button" (click)="add('0')">0</button>
  <button class="btn btn--ghost" type="button" aria-label="Delete last digit" (click)="remove()">
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg>
  </button>
</div>
