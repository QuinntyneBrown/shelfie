@if (locked()) {
  <div class="alert alert--warning" role="status">
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
      <path d="M12 3 2 20h20L12 3zM12 10v4M12 17h.01" />
    </svg>
    <div class="alert__body">
      <div class="alert__title">Let’s take a short break</div>
      <div>
        The PIN was wrong 5 times, so the keypad is locked for 5 minutes. Try again in
        {{ timeLeft() }}. Ask a grown-up if you’ve forgotten it.
      </div>
    </div>
  </div>
}
<div
  class="pin-dots"
  role="status"
  [attr.aria-label]="digits().length + ' of 4 digits entered'"
  [attr.aria-invalid]="error() ? true : null"
  [attr.aria-describedby]="error() ? 'pin-error' : null"
>
  @for (slot of slots; track slot) {
    <span [attr.data-filled]="slot < digits().length ? '' : null"></span>
  }
</div>
@if (error(); as message) {
  <p class="field__error" id="pin-error">{{ message }}</p>
}
<div class="pinpad" role="group" aria-label="PIN keypad">
  @for (key of keys; track key) {
    <button class="btn" type="button" [disabled]="locked()" (click)="add(key)">{{ key }}</button>
  }
  <button class="btn btn--ghost" type="button" (click)="switchReader.emit()">
    Not {{ name() }}?
  </button>
  <button class="btn" type="button" [disabled]="locked()" (click)="add('0')">0</button>
  <button
    class="btn btn--ghost"
    type="button"
    aria-label="Delete last digit"
    [disabled]="locked()"
    (click)="remove()"
  >
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg>
  </button>
</div>
