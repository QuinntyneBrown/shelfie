<header class="topbar">
  <a class="topbar__brand" [routerLink]="home()">
    <svg class="icon icon--lg" aria-hidden="true" viewBox="0 0 24 24">
      <path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM8 7h6" />
    </svg>
    Shelfie
  </a>
  <span class="topbar__spacer"></span>
  <button
    class="avatar avatar--sm account"
    [class]="'avatar--' + color()"
    type="button"
    aria-haspopup="menu"
    [attr.aria-label]="'Account menu for ' + name()"
  >
    {{ initial() }}
  </button>
</header>
