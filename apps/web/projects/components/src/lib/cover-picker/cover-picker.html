<div class="field" role="group" [attr.aria-labelledby]="labelId">
  <span class="field__label" [id]="labelId">{{ label() }}</span>
  <div class="cover-picker__actions">
    <label class="btn btn--sm" [attr.aria-busy]="busy() || null">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M4 8h3l2-3h6l2 3h3v11H4z" />
        <circle cx="12" cy="13" r="3.5" />
      </svg>
      {{ hasPicture() ? 'Change picture' : 'Add a picture' }}
      <input
        #file
        class="visually-hidden"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        [disabled]="busy()"
        [attr.aria-invalid]="shownError() ? true : null"
        [attr.aria-describedby]="shownError() ? helpId + ' ' + errorId : helpId"
        (change)="choose($event)"
      />
    </label>
    @if (hasPicture()) {
      <button class="btn btn--sm btn--ghost" type="button" [disabled]="busy()" (click)="remove()">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
        </svg>
        Remove picture
      </button>
    }
  </div>
  <p class="field__help" role="status" [id]="helpId">
    {{
      busy()
        ? 'Uploading the picture…'
        : 'A photo of the real cover. JPEG, PNG or WebP, up to 5 MB.'
    }}
  </p>
  @if (shownError(); as message) {
    <p class="field__error" role="alert" [id]="errorId">{{ message }}</p>
  }
</div>
