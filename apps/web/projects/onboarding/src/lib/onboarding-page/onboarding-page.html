<sh-auth-layout>
  <sh-step-indicator [current]="number()" [total]="total" />
  @switch (current()) {
    @case ('child') {
      <div class="card stack wizard">
        <h1>What’s your child’s name?</h1>
      </div>
    }
    @default {
      <div class="card stack wizard">
        <img class="wizard__art" src="/onboarding/welcome.svg" alt="" width="240" height="180" />
        <h1>Let’s set up Shelfie for your family</h1>
        <p class="text-muted">
          Add your child, choose how she signs in and pick a reward to read toward. About two
          minutes.
        </p>
        <div class="wizard__actions">
          <a class="btn btn--primary btn--lg btn--block" routerLink="/onboarding/child">Let’s go</a>
        </div>
      </div>
    }
  }
  <p class="text-caption centred"><a href="/review" (click)="skip($event)">Skip for now</a></p>
</sh-auth-layout>
