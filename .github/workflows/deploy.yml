name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shelfie.kids
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: shelfie-${{ github.sha }}.tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Assemble the release tarball
        run: |
          rm -rf release
          mkdir -p release/apps/api release/web release/host
          cp package.json package-lock.json release/
          cp -r apps/api/package.json apps/api/src release/apps/api/
          cp -r apps/web/dist/shelfie/browser/. release/web/
          cp -r infra/host/. release/host/
          (cd release && npm ci --omit=dev --workspace apps/api --ignore-scripts)
          tar -czf "$RELEASE" -C release .
          ls -lh "$RELEASE"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload the release to Blob Storage
        run: |
          az storage blob upload --auth-mode login --only-show-errors --overwrite \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" --container-name releases \
            --name "$RELEASE" --file "$RELEASE"

      - name: Deploy the release on the VM
        run: |
          script="$(printf 'export RELEASE_SHA=%q STORAGE_ACCOUNT=%q\n' "$GITHUB_SHA" "${{ vars.AZURE_STORAGE_ACCOUNT }}"; cat infra/host/fetch-release.sh)"
          output="$(az vm run-command invoke --only-show-errors \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript --scripts "$script" --query 'value[0].message' -o tsv)"
          printf '%s\n' "$output"
          grep -q DEPLOY_OK <<<"$output"

      - name: Check production health
        run: curl -fsS --retry 5 --retry-delay 5 https://shelfie.kids/api/health
